name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4.37.4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Audit the pinned runtime requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit
          # The container installs exactly this file, so this is the real
          # supply chain rather than whatever a resolver happened to pick.
          pip-audit --strict --progress-spinner off -r android_timeline/requirements.txt

      - name: Audit the development toolchain
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/dev-requirements.txt
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          print("\n".join(data["project"]["optional-dependencies"]["dev"]))
          PY
          pip-audit --strict --progress-spinner off -r /tmp/dev-requirements.txt

  bandit:
    name: Static security analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Bandit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip bandit
          bandit -r android_timeline/app custom_components -ll -ii

  container-scan:
    name: Container image scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.2.0

      - name: Build the image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./android_timeline
          load: true
          push: false
          tags: android-timeline:scan

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: android-timeline:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload the scan result
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: trivy.sarif
          category: trivy-container

      - name: Fail on a fixable critical vulnerability
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: android-timeline:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  no-secret-verification:
    name: No committed secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan full history for credential-shaped strings
        run: |
          set -euo pipefail
          patterns=(
            'gh[pousr]_[A-Za-z0-9]{36,}'
            'github_pat_[A-Za-z0-9_]{60,}'
            'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.'
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            'AKIA[0-9A-Z]{16}'
            '\.ui\.nabu\.casa'
          )
          failed=0
          for pattern in "${patterns[@]}"; do
            if git rev-list --all | while read -r sha; do
                 git grep -InE -e "${pattern}" "${sha}" -- . 2>/dev/null || true
               done | grep .; then
              echo "::error::a credential-shaped string matching /${pattern}/ is in history"
              failed=1
            fi
          done
          exit "$failed"

      - name: The app config must not ship a token value
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          # Only the options block may assign a value; the schema block
          # legitimately declares dmin_token: password?.
          python - <<'PY'
          import pathlib
          import sys

          import yaml

          config = yaml.safe_load(pathlib.Path("android_timeline/config.yaml").read_text())
          if config.get("options", {}).get("admin_token"):
              print("::error::config.yaml ships an admin_token value")
              sys.exit(1)
          if config.get("schema", {}).get("admin_token") != "password?":
              print("::error::admin_token must be declared as an optional password")
              sys.exit(1)
          print("no token value in the shipped configuration")
          PY
          echo 'no token value in the shipped configuration'
