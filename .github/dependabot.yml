version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: [dependencies, github-actions]

  - package-ecosystem: pip
    directory: "/android_timeline"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: [dependencies, python, runtime]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: [dependencies, python]
    groups:
      dev-tooling:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/android_timeline"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
